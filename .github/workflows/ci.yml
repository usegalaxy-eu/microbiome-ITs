name: Container images

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'metadavis/**'
      - 'microbiomeprofiler/**'
      - 'cminet/**'
      - 'miadash/**'
      - 'libreqda/**'
      - 'holomics/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'metadavis/**'
      - 'microbiomeprofiler/**'
      - 'cminet/**'
      - 'miadash/**'
      - 'libreqda/**'
      - 'holomics/**'
  release:
    types:
      - published
  repository_dispatch:
    types:
      - image-release
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        required: true
        type: choice
        options:
          - metadavis
          - microbiomeprofiler
          - cminet
          - miadash
          - libreqda
          - holomics
      tag:
        description: Image tag to publish (leave empty to auto-increment the latest published version; the image also gets :latest)
        required: false
        default: ''
        type: string

env:
  IMAGE_REPOSITORY: quay.io/galaxy

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      metadavis: ${{ steps.filter.outputs.metadavis }}
      microbiomeprofiler: ${{ steps.filter.outputs.microbiomeprofiler }}
      cminet: ${{ steps.filter.outputs.cminet }}
      miadash: ${{ steps.filter.outputs.miadash }}
      libreqda: ${{ steps.filter.outputs.libreqda }}
      holomics: ${{ steps.filter.outputs.holomics }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed images
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            metadavis:
              - '.github/workflows/ci.yml'
              - 'metadavis/**'
            microbiomeprofiler:
              - '.github/workflows/ci.yml'
              - 'microbiomeprofiler/**'
            cminet:
              - '.github/workflows/ci.yml'
              - 'cminet/**'
            miadash:
              - '.github/workflows/ci.yml'
              - 'miadash/**'
            libreqda:
              - '.github/workflows/ci.yml'
              - 'libreqda/**'
            holomics:
              - '.github/workflows/ci.yml'
              - 'holomics/**'

  build-holomics:
    needs: changes
    if: needs.changes.outputs.holomics == 'true'
    uses: ./.github/workflows/image.yml
    with:
      context: holomics
      image: holomics-gxit
      push: false

  build-metadavis:
    needs: changes
    if: needs.changes.outputs.metadavis == 'true'
    uses: ./.github/workflows/image.yml
    with:
      context: metadavis
      image: metadavis-gxit
      push: false

  build-microbiomeprofiler:
    needs: changes
    if: needs.changes.outputs.microbiomeprofiler == 'true'
    uses: ./.github/workflows/image.yml
    with:
      context: microbiomeprofiler
      image: microbiomeprofiler-gxit
      push: false

  build-cminet:
    needs: changes
    if: needs.changes.outputs.cminet == 'true'
    uses: ./.github/workflows/image.yml
    with:
      context: cminet
      image: cminet-gxit
      push: false

  build-miadash:
    needs: changes
    if: needs.changes.outputs.miadash == 'true'
    uses: ./.github/workflows/image.yml
    with:
      context: miadash
      image: miadash-gxit
      push: false

  build-libreqda:
    needs: changes
    if: needs.changes.outputs.libreqda == 'true'
    uses: ./.github/workflows/image.yml
    with:
      context: libreqda
      image: libreqda-gxit
      push: false

  # Computes the next version tag (e.g. 1.0.0 -> 1.0.1) from the version tags
  # already published on quay.io. Release jobs fall back to this whenever no
  # explicit tag was requested, so publishing never clobbers an existing tag.
  next-tag:
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      metadavis: ${{ steps.bump.outputs.metadavis }}
      microbiomeprofiler: ${{ steps.bump.outputs.microbiomeprofiler }}
      cminet: ${{ steps.bump.outputs.cminet }}
      miadash: ${{ steps.bump.outputs.miadash }}
      libreqda: ${{ steps.bump.outputs.libreqda }}
      holomics: ${{ steps.bump.outputs.holomics }}
    steps:
      - name: Compute next version tag per image
        id: bump
        env:
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${QUAY_OAUTH_TOKEN:-}" ]; then
            auth=(-u '$oauthtoken:'"${QUAY_OAUTH_TOKEN}")
          fi
          for image in metadavis microbiomeprofiler cminet miadash libreqda holomics; do
            tags=""
            for page in $(seq 1 20); do
              names=$(curl -sf "${auth[@]}" \
                "https://quay.io/api/v1/repository/galaxy/${image}-gxit/tag/?limit=100&page=${page}&onlyActiveTags=true" \
                | jq -r '.tags[]?.name // empty' || true)
              [ -z "${names}" ] && break
              tags="${tags}"$'\n'"${names}"
            done
            # Normalize ad-hoc version tags (v1, 1.2, v1.2.3, ...) to x.y.z
            versions=$(grep -E '^v?[0-9]+(\.[0-9]+){0,2}$' <<< "${tags}" \
              | sed -E 's/^v//' \
              | awk -F. '{ printf "%d.%d.%d\n", $1, ($2 == "" ? 0 : $2), ($3 == "" ? 0 : $3) }' || true)
            latest=$(sort -V <<< "${versions}" | tail -n 1 || true)
            if [ -z "${latest}" ]; then
              next="1.0.0"
            else
              IFS=. read -r major minor patch <<< "${latest}"
              next="${major}.${minor}.$((patch + 1))"
            fi
            echo "${image}=${next}" >> "${GITHUB_OUTPUT}"
            echo "Next tag for ${image}-gxit: ${next} (latest published version tag: ${latest:-none})"
          done

  release-metadavis:
    needs: next-tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.image == 'metadavis') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'metadavis')
    uses: ./.github/workflows/image.yml
    with:
      context: metadavis
      image: metadavis-gxit
      push: true
      tag: ${{ github.event.client_payload.tag || (github.event_name == 'release' && github.event.release.tag_name) || inputs.tag || needs.next-tag.outputs.metadavis }}
    secrets: inherit

  release-microbiomeprofiler:
    needs: next-tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.image == 'microbiomeprofiler') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'microbiomeprofiler')
    uses: ./.github/workflows/image.yml
    with:
      context: microbiomeprofiler
      image: microbiomeprofiler-gxit
      push: true
      tag: ${{ github.event.client_payload.tag || (github.event_name == 'release' && github.event.release.tag_name) || inputs.tag || needs.next-tag.outputs.microbiomeprofiler }}
    secrets: inherit

  release-cminet:
    needs: next-tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.image == 'cminet') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'cminet')
    uses: ./.github/workflows/image.yml
    with:
      context: cminet
      image: cminet-gxit
      push: true
      tag: ${{ github.event.client_payload.tag || (github.event_name == 'release' && github.event.release.tag_name) || inputs.tag || needs.next-tag.outputs.cminet }}
    secrets: inherit

  release-miadash:
    needs: next-tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.image == 'miadash') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'miadash')
    uses: ./.github/workflows/image.yml
    with:
      context: miadash
      image: miadash-gxit
      push: true
      tag: ${{ github.event.client_payload.tag || (github.event_name == 'release' && github.event.release.tag_name) || inputs.tag || needs.next-tag.outputs.miadash }}
    secrets: inherit

  release-libreqda:
    needs: next-tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.image == 'libreqda') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'libreqda')
    uses: ./.github/workflows/image.yml
    with:
      context: libreqda
      image: libreqda-gxit
      push: true
      tag: ${{ github.event.client_payload.tag || (github.event_name == 'release' && github.event.release.tag_name) || inputs.tag || needs.next-tag.outputs.libreqda }}
    secrets: inherit

  release-holomics:
    needs: next-tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.image == 'holomics') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'holomics')
    uses: ./.github/workflows/image.yml
    with:
      context: holomics
      image: holomics-gxit
      push: true
      tag: ${{ github.event.client_payload.tag || (github.event_name == 'release' && github.event.release.tag_name) || inputs.tag || needs.next-tag.outputs.holomics }}
    secrets: inherit
