name: Build image

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string
      push:
        required: true
        type: boolean
      tag:
        required: false
        default: ci
        type: string
    secrets:
      QUAY_OAUTH_TOKEN:
        required: false

env:
  IMAGE_REGISTRY: quay.io

jobs:
  image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.push && 'quay.io' || null }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: $oauthtoken
          password: ${{ secrets.QUAY_OAUTH_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/paulzierep/${{ inputs.image }}:${{ inputs.tag }}
            ${{ inputs.push && format('{0}/paulzierep/{1}:latest', env.IMAGE_REGISTRY, inputs.image) || '' }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
