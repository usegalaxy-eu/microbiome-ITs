name: Deploy interactive tool to usegalaxy.eu

# Copies a tool's Galaxy wrapper into a branch on a fork of
# usegalaxy-eu/galaxy. The workflow never touches usegalaxy-eu/galaxy and does
# not open a pull request: it prints a compare URL that opens the PR with one
# click, so it only needs write access to the fork.
#
# The image is checked first: a wrapper that points at an unpublished container
# would only fail on the server, so the job stops before it pushes anything.
#
# Requires the FORK_PUSH_TOKEN secret: a token with Contents: read and write on
# the fork only (fine-grained PAT), e.g. paulzierep/galaxy.
#
# The fork must already have the target branch (the branch is extended, not
# recreated), so a fork whose branch is missing has to be refreshed once.
#
# The tool panel entry is still a separate change in
# usegalaxy-eu/infrastructure-playbook
# (templates/galaxy/config/tool_conf.xml.j2); the summary carries the line.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool XML to deploy
        required: true
        type: choice
        options:
          - libreqda
          - miadash
          - cminet
          - metadavis
          - microbiomeprofiler
          - all
        default: libreqda
      fork:
        description: Fork of usegalaxy-eu/galaxy that receives the branch
        required: true
        default: paulzierep/galaxy
        type: string
      target_branch:
        description: Branch of usegalaxy-eu/galaxy the pull request should target
        required: true
        default: release_26.1_europe
        type: string
      dry_run:
        description: Validate the XML and the image, print the diff, do not push
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.tool }}-${{ inputs.fork }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.tools.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the tool list
        id: tools
        env:
          PICKED: ${{ inputs.tool }}
        run: |
          set -euo pipefail
          if [ "$PICKED" = "all" ]; then
            list=$(for dir in */gxit; do basename "$(dirname "$dir")"; done | sort | jq -R . | jq -s -c .)
          else
            list=$(jq -nc --arg tool "$PICKED" '[$tool]')
          fi
          echo "Deploying: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.tool }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.plan.outputs.tools) }}
    env:
      TOOL: ${{ matrix.tool }}
      XML: ${{ matrix.tool }}/gxit/interactivetool_${{ matrix.tool }}.xml
      BRANCH: add-it-${{ matrix.tool }}
      FORK_REPO: ${{ inputs.fork }}
      TARGET_REPO: usegalaxy-eu/galaxy
      TARGET_BRANCH: ${{ inputs.target_branch }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the tool XML
        id: xml
        run: |
          set -euo pipefail
          if [ ! -f "$XML" ]; then
            echo "::error::$XML does not exist in this repository"
            exit 1
          fi
          python3 - "$XML" "interactive_tool_${TOOL}" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          path, expected_id = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          assert root.tag == "tool", f"{path}: expected a <tool> root, found <{root.tag}>"
          assert root.get("tool_type") == "interactive", f"{path}: tool_type must be 'interactive'"
          assert root.get("id") == expected_id, f"{path}: id={root.get('id')!r}, expected {expected_id!r}"
          containers = [c.text.strip() for c in root.findall("./requirements/container") if c.text]
          assert len(containers) == 1, f"{path}: expected exactly one <container>, found {len(containers)}"
          ports = [p.text.strip() for p in root.findall("./entry_points/entry_point/port") if p.text]
          assert ports, f"{path}: no <port> declared in <entry_points>"
          print(f"id={root.get('id')} version={root.get('version')} container={containers[0]} port={ports[0]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"image={containers[0]}\n")
              out.write(f"tool_id={root.get('id')}\n")
          PY

      - name: Check that the image is published
        env:
          IMAGE: ${{ steps.xml.outputs.image }}
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          registry="${IMAGE%%/*}"
          rest="${IMAGE#*/}"
          repo="${rest%:*}"
          tag="${rest##*:}"
          if [ "$registry" != "quay.io" ]; then
            echo "::error::$IMAGE: only quay.io images are checked by this workflow"
            exit 1
          fi
          api="https://quay.io/api/v1/repository/${repo}/tag/?specificTag=${tag}&onlyActiveTags=true"
          auth=()
          if [ -n "${QUAY_OAUTH_TOKEN:-}" ]; then
            auth=(-u "\$oauthtoken:${QUAY_OAUTH_TOKEN}")
          fi
          code=$(curl -s -o registry.json -w '%{http_code}' "${auth[@]}" "$api")
          if [ "$code" != "200" ]; then
            detail=$(jq -r '.error_message // .detail // "no details"' registry.json 2>/dev/null || true)
            echo "::error::$IMAGE is not published: quay.io answered HTTP $code for ${repo}:${tag} (${detail}). Publish it first with Actions -> Container images -> Run workflow (image: ${TOOL})."
            exit 1
          fi
          if [ "$(jq '.tags | length' registry.json)" -lt 1 ]; then
            echo "::error::$IMAGE is not published: tag ${tag} does not exist on quay.io/${repo}. Publish it first with Actions -> Container images -> Run workflow (image: ${TOOL})."
            exit 1
          fi
          digest=$(jq -r '.tags[0].manifest_digest' registry.json)
          echo "Image ${IMAGE} is published (${digest})"

      - name: Create the branch in the fork
        id: prepare
        env:
          TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            url="https://x-access-token:${TOKEN}@github.com/${FORK_REPO}.git"
          elif [ "$DRY_RUN" = "true" ]; then
            url="https://github.com/${FORK_REPO}.git"
          else
            echo "::error::The FORK_PUSH_TOKEN secret is not set (it needs Contents: read and write on ${FORK_REPO})"
            exit 1
          fi

          # The branch is built on top of the fork's own copy of the target
          # branch: that keeps the push to a single commit, and a fork that
          # never fetched the upstream branch does not have to transfer its
          # whole history.
          rm -rf target
          if ! git clone --quiet --filter=blob:none --sparse --single-branch \
                 --branch "$TARGET_BRANCH" "$url" target 2> clone.err; then
            cat clone.err >&2
            echo "::error::${FORK_REPO} has no branch ${TARGET_BRANCH}, so there is nothing to build on. Create it once in the fork, then re-run: fork usegalaxy-eu/galaxy again, or locally: git clone git@github.com:${FORK_REPO}.git galaxy && cd galaxy && git remote add upstream https://github.com/${TARGET_REPO}.git && git fetch upstream ${TARGET_BRANCH} && git push origin FETCH_HEAD:${TARGET_BRANCH}"
            exit 1
          fi
          cd target
          git sparse-checkout set tools/interactive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          echo "base: ${base:0:12} on ${FORK_REPO}@${TARGET_BRANCH}"
          upstream_tip=$(git ls-remote "https://github.com/${TARGET_REPO}.git" "refs/heads/${TARGET_BRANCH}" | cut -f1)
          if [ -n "$upstream_tip" ] && [ "$upstream_tip" != "$base" ]; then
            echo "::warning title=Fork branch is not up to date::${FORK_REPO}@${TARGET_BRANCH} is at ${base:0:12}, ${TARGET_REPO} is at ${upstream_tip:0:12}. The pull request still adds only this tool, but sync the fork branch if you want an up-to-date base."
          fi

          destination="tools/interactive/$(basename "$XML")"
          cp "../$XML" "$destination"
          git add "$destination"

          # Tool panel icons live next to the wrapper in tools/interactive/.
          # Every PNG in the tool's gxit directory is copied along with it.
          for asset in "../$(dirname "$XML")"/*.png; do
            [ -e "$asset" ] || continue
            cp "$asset" "tools/interactive/$(basename "$asset")"
            git add "tools/interactive/$(basename "$asset")"
          done

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${BRANCH} already contains an identical $(basename "$destination"), nothing to do"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff --cached --stat

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### ${TOOL}: would push ${BRANCH} to ${FORK_REPO}"
              echo
              echo '```diff'
              git --no-pager diff --cached
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git switch -c "$BRANCH"
          git commit -q -m "Add the ${TOOL} interactive tool"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

      - name: Print the pull request link
        if: steps.prepare.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          TOOL_ID: ${{ steps.xml.outputs.tool_id }}
          IMAGE: ${{ steps.xml.outputs.image }}
        run: |
          set -euo pipefail
          fork_owner="${FORK_REPO%%/*}"
          url="https://github.com/${TARGET_REPO}/compare/${TARGET_BRANCH}...${fork_owner}:${BRANCH}?expand=1"
          xml_name=$(basename "$XML")
          {
            echo "### ${TOOL}"
            echo
            echo "Branch ${BRANCH} pushed to ${FORK_REPO}."
            echo
            echo "Open the pull request: <${url}>"
            echo
            echo "Suggested title: \`Add the ${TOOL} interactive tool\`"
            echo
            echo "Suggested description:"
            echo
            echo '```markdown'
            echo "Adds tools/interactive/${xml_name} to the interactive tools collection."
            echo
            echo "- Tool id: ${TOOL_ID}"
            echo "- Container image: ${IMAGE} (checked to be published before the branch was pushed)"
            echo "- Source: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${XML}"
            echo
            echo "The XML is copied unchanged from usegalaxy-eu/microbiome-ITs by"
            echo ".github/workflows/deploy-tool.yml in that repository."
            echo
            echo "Tool panel registration is a separate change in usegalaxy-eu/infrastructure-playbook"
            echo "(templates/galaxy/config/tool_conf.xml.j2):"
            echo
            echo "    <tool file=\"interactive/${xml_name}\" />"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Pull request for ${TOOL}::${url}"
